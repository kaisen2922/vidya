<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Subjects - Evidya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="notes-system.css" />
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="screens">
        <section class="screen active">
          <div class="page" id="subjectsPage">
            <header class="page-head">
              <button class="icon-btn back" onclick="window.history.back()"><i class="fa-solid fa-arrow-left"></i></button>
              <h3>Subjects</h3>
              <div style="width:36px"></div>
            </header>

            <div class="page-body" style="padding:20px; overflow-x:hidden; scroll-behavior:smooth;">
              <div id="notesBreadcrumbs" class="notes-breadcrumbs" style="display:block; margin-bottom:12px;"></div>

              <section id="streamSection">
                <div class="flow-header">
                  <h4>Choose Stream</h4>
                  <p>Select your stream to see subjects.</p>
                </div>
                <div class="streams-grid" id="streamsGrid"></div>
              </section>

              <section id="subjectSection" style="margin-top:16px;">
                <div class="flow-header">
                  <h4>Subjects</h4>
                  <p>Choose your subject to start learning 📘</p>
                </div>
                <div id="subjectsFlowGrid" class="subjects-flow-grid"></div>
              </section>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="google-drive-notes.js" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (typeof initSubjectsPage === 'function') initSubjectsPage();
      }, 50);
    });
  </script>
</body>
</html>
